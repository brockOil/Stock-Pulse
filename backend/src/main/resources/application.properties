spring.application.name=stockpulse-backend
server.port=8080

# --- Database (H2, in-memory, zero setup) ---
spring.datasource.url=jdbc:h2:mem:stockpulse;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Let Hibernate create the schema first, then run data.sql to seed it
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
# H2 web console disabled by default - enable locally only if you need to inspect data
spring.h2.console.enabled=false

# --- CORS (frontend dev servers only) ---
app.cors.allowed-origins=http://localhost:5173,http://localhost:4200

# --- Commerce engine: active strategy per suggestion type ---
# Values: RULE_BASED | AI. Switchable at runtime via PATCH /api/config/strategy without a restart.
commerce.pricing-strategy=RULE_BASED
commerce.reorder-strategy=RULE_BASED

# Rule-based pricing strategy tuning
commerce.rules.low-stock-increase-pct=0.10
commerce.rules.demand-spike-increase-pct=0.05
commerce.rules.demand-spike-multiplier=2.0
commerce.rules.reorder-multiplier=3
commerce.rules.default-lead-time-days=7

# Agentic loop trigger tuning
commerce.trigger.demand-spike-multiplier=3.0
commerce.trigger.demand-spike-min-absolute=5

# AI response sanity bounds (reject/fallback if outside these multiples of current price)
commerce.ai.price-max-multiplier=5.0
commerce.ai.price-min-multiplier=0.2
commerce.ai.max-reorder-quantity=100000

# --- Async executor backing the agentic loop ---
commerce.async.core-pool-size=2
commerce.async.max-pool-size=6
commerce.async.queue-capacity=100

# --- LLM Gateway ---
# provider: gemini | groq | ollama
llm.provider=ollama
llm.api-key=${LLM_API_KEY:}
llm.model=llama3.1
llm.base-url=http://localhost:11434
llm.connect-timeout-ms=4000
llm.read-timeout-ms=15000

logging.level.com.stockpulse=INFO
